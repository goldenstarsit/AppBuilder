<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f7fb" id="themeColor">
<title>App Builder — Dashboard</title>
<script>
(() => {
  try {
    const saved = localStorage.getItem("appbuilder-theme");
    if (saved === "dark" || (saved !== "light" && matchMedia("(prefers-color-scheme: dark)").matches))
      document.documentElement.dataset.theme = "dark";
  } catch {}
})();
</script>
<link rel="stylesheet" href="./index.css">
</head>
<body>
<header class="topbar">
  <span aria-hidden="true"></span>
  <button class="left-button" aria-label="Settings">
  ⚙
</button>
  <h2 class="topbar-title">App Builder</h2>
  <button class="theme-button" id="themeButton" type="button" aria-label="Switch theme" title="Switch theme"><span id="themeIcon" aria-hidden="true">☾</span></button>
</header>
<main class="main">
  <section class="app-title" aria-labelledby="page-title">
    <h1 id="page-title" style="display:flex;align-items:center;justify-content:center; gap:10px">
      <span>App Builder</span>
    </h1>
  </section>

  <section class="dashboard-card" aria-label="Table selection">
    <label class="field-label" for="platformSelect">Select Platform</label>
    <select class="environment-select" id="platformSelect" name="platform">
      <option value="">Loading tables…</option>
    </select>
    <p class="status-line" id="statusMessage" role="status" aria-live="polite">Loading table definitions…</p>
  </section>

<section class="dashboard-card" aria-label="Category selection">
    <label class="field-label" for="categorySelect">Select Category</label>
    <select class="environment-select" id="categorySelect" name="category" disabled>
      <option value="">Select a platform first…</option>
    </select>
    <p class="status-line" id="categoryStatus" role="status" aria-live="polite">Choose a platform to load categories.</p>
  </section>

<section class="dashboard-card" aria-label="Table selection">
    <label class="field-label" for="tableSelect">Select Item</label>
    <select class="environment-select" id="tableSelect" name="item">
      <option value="">Loading tables…</option>
    </select>
    <p class="status-line" id="itemStatusMessage" role="status" aria-live="polite">Loading table definitions…</p>
  </section>

    <section class="dashboard-card" aria-label="Table">
      <h2 class="field-label" id="selectionTableTitle">Platform data</h2>
      <p class="table-ui-description" id="selectionTableStatus">All platforms</p>
      <div class="table-ui-scroll" id="selectionTableContent"></div>
    </section>

</main>
<script src="/index.js?v=20261010-5" defer></script>
</body>
</html>
